<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barndo 3D Model</title><style>
:root{--bg:#ffffffee;--fg:#1d2730;--mu:#66727d;--ac:#2f6fb3;--bd:#dde3e8}
.dark{--bg:#1c222bee;--fg:#e8edf2;--mu:#9aa6b2;--bd:#323b47}
html,body{margin:0;height:100%;overflow:hidden;font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--fg)}
#view{position:fixed;inset:0;touch-action:none}.labels{position:absolute;inset:0;pointer-events:none}
.panel{position:fixed;left:12px;top:12px;width:250px;background:var(--bg);backdrop-filter:blur(8px);border:1px solid var(--bd);border-radius:14px;box-shadow:0 6px 24px #0002;padding:12px 14px;z-index:5}
.panel h1{font-size:15px;margin:0}.panel .sub{color:var(--mu);font-size:12px;margin:2px 0 8px}
.panel label{display:flex;align-items:center;gap:9px;padding:5px 0;cursor:pointer;user-select:none}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac);margin:0}
hr{border:0;border-top:1px solid var(--bd);margin:6px 0}
#panelToggle{position:absolute;right:8px;top:8px;border:0;background:none;color:var(--mu);font-size:18px;cursor:pointer}
.collapsed .panel .body{display:none}.collapsed .panel{width:auto}
.views{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:4px;background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:4px;z-index:5;box-shadow:0 6px 24px #0002}
.views button{border:0;background:none;color:var(--fg);padding:8px 12px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer}
.views button.on{background:var(--ac);color:#fff}
.lbl{font-size:12px;padding:2px 7px;border-radius:6px;white-space:nowrap;background:#fffd;color:#1d2730;border:1px solid #0001}
.room{font-weight:600}.up{background:#eaf2ffdd}.dim{background:#d35400;color:#fff;font-weight:600;border:0}
.fl{background:#2f6fb3;color:#fff;font-weight:700;border:0}.call{font-size:11px;background:#ffffffe6}.warn{border:1px solid #c0392b;color:#a93226}
.dark .lbl:not(.dim):not(.fl){background:#232a34e6;color:#e8edf2;border-color:#fff2}
@media (max-width:600px){.panel{left:8px;right:8px;top:8px;width:auto;padding:10px 12px}.panel .body{display:grid;grid-template-columns:1fr 1fr;column-gap:8px}
.panel .body hr,.panel .body .sub{grid-column:1/-1}.views{left:8px;right:8px;transform:none;justify-content:space-between}.views button{padding:8px 7px;font-size:13px}.call{font-size:9px}}
</style></head><body><div id="view"></div>

<label><input type="checkbox" id="skin" checked>Exterior walls</label>
<label><input type="checkbox" id="roof" checked>Roof</label>
<label><input type="checkbox" id="steel">Steel structure</label>
<label><input type="checkbox" id="up" checked>Upstairs</label>
<label><input type="checkbox" id="lbls" checked>Room labels</label>
<label><input type="checkbox" id="dims">Dimensions</label>
<label><input type="checkbox" id="dark">Dark mode</label>
</div></div>
